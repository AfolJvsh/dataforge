name: Bootstrap full source
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 -d > /tmp/source.tar.xz
          printf '%s  %s\n' '7e9d0968b8aeb2dd5c585d8048f8a8b0482ac5f02b6d318b8caf38530a6482c0' '/tmp/source.tar.xz' | sha256sum -c -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          ROOT="$(find /tmp/source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$ROOT"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publish complete implementation"
          git push origin HEAD:main
